name: Build VoidMain-Bridge
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidMain-Bridge-JAR
          path: target/voidmain-bridge-1.2.0.jar
          if-no-files-found: error
