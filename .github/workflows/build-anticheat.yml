name: Build VoidMain AntiCheat

on:
  push:
    branches:
      - voidmain-anticheat-bridge
    paths:
      - "anticheat/**"
      - ".github/workflows/build-anticheat.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        working-directory: anticheat
        run: mvn -B -ntp clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidMain-AntiCheat-1.0.1
          path: anticheat/target/VoidMain-AntiCheat-1.0.0.jar
          if-no-files-found: error
