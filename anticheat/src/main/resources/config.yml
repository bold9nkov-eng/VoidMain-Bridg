# VoidMain AntiCheat — GrimAC + Vulcan integration
# Paper 1.21.11 / Java 21

exempt:
  operators: true
  permission: "voidmain.anticheat.bypass"

grim:
  enabled: true
  window-seconds: 15
  flag-thresholds:
    Reach: 4
    Hitboxes: 6
    MultiInteractA: 8
    MultiInteractB: 8
    AimDuplicateLook: 8
    AimModulo360: 8

vulcan:
  enabled: true
  intercept-combat-punishments: true
  # Ladder applies once for each VulcanPunishEvent, not for every raw flag.
  # The counter is stored by UUID in plugins/VoidMain-AntiCheat/violations.yml.
  violation-ladder:
    enabled: true

manual-check:
  # A player is automatically released after this many seconds if staff forgets.
  timeout-seconds: 300

punishment:
  enabled: true
  animation-ticks: 30
  drop-inventory: true
  ban-days: 0
  broadcast: true
  reason-prefix: "VoidMain AntiCheat"
  purple-rgb: "8A2BE2"
  lavender-rgb: "C9A0FF"
  white-rgb: "FFFFFF"

messages:
  title: "VOIDMAIN"
  subtitle: "НАРУШЕНИЕ ОБНАРУЖЕНО"
  kick: "&5&lVOIDMAIN &8» &fВы заблокированы античитом VoidMain."
  broadcast: "&5&lVOIDMAIN &8» &fИгрок &d%player% &fзаблокирован за &d%check%&f."
