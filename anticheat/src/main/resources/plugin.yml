name: VoidMain-AntiCheat
version: 1.0.2
main: ru.voidmain.anticheat.VoidMainAntiCheat
api-version: '1.21'
load: POSTWORLD
softdepend:
  - GrimAC
  - Vulcan
  - packetevents
authors: [NeZoX, VoidMain]
description: Purple-white anti-cheat bridge for GrimAC and Vulcan
commands:
  voidac:
    description: VoidMain AntiCheat management and manual player checks
    usage: /voidac <status|check|release|violations|reset|reload>
permissions:
  voidmain.anticheat.admin:
    description: Manage VoidMain AntiCheat and call players for manual checks
    default: op
  voidmain.anticheat.bypass:
    description: Bypass automatic VoidMain AntiCheat checks and punishments
    default: false
